      static_pages:
        democratic_quality_indicators:
          content: |-
            <h2>Decidim'de kalite göstergesini ölçmek için gösterge sistemi.</h2>

            <h3>Giriş</h3>
            <p>Demokratik kalite, Decidim'in temel bir ilkesidir. Bunu korumak için, platformdaki katılım süreçlerinin kalitesini değerlendirmeye yardımcı olan bir gösterge sistemi geliştirdik. Bu makale, bu göstergelerin nasıl hesaplandığını açıklar.</p>

            <h3>Göstergeler Nasıl Hesaplanır?</h3>
            <p>Kalite göstergelerini toplamak için iki yöntem tanımladık:</p>

            <ol>
              <li><strong>Otomatik Ölçütler:</strong> Bunlar doğrudan Decidim platform verilerinden hesaplanır.</li>
              <li><strong>Öz Değerlendirme Soruları:</strong> Bunlar bir yönetici tarafından doldurulan bir forma dayanır.</li>
            </ol>

            <p>Her gösterge bir yüzde (n/toplam) olarak ifade edilir. Bu yüzde daha sonra 1'den 5'e kadar bir ölçekte bir puana dönüştürülür:</p>

            <ul>
              <li>1 = 0–20%</li>
              <li>2 = 20–40%</li>
              <li>3 = 40–60%</li>
              <li>4 = 60–80%</li>
              <li>5 = 80–100%</li>
            </ul>

            <br><br>
            <h3>Otomatik Ölçütler</h3>
            <p>Bu ölçütler, Decidim'de mevcut verilerden otomatik olarak hesaplanır. Her katılım süreci için değerlendirilir ve yöneticiler tarafından herkese açık hâle getirilebilir; böylece tüm katılımcılar erişebilir.</p>

            <p>Dört ana gösterge tanımladık: Yurttaş Etkisi, Melezleşme, Yanıt Verebilirlik ve İzlenebilirlik:</p>

            <h3>Yurttaş Etkisi</h3>

            <p>Bu gösterge, kabul edilen öneriler ve sürecin çıktıları üzerindeki yurttaş etkisi düzeyini ölçer.</p>

            <ul>
              <li>
                Öneriler üzerinde yurttaş etkisi
                <ul>
                  <li>Kabul edilen önerilerin yüzdesi (n/toplam)</li>
                  <li>Toplam yurttaş önerileri içinde onaylanan <em>yurttaş</em> önerilerinin yüzdesi (onaylanan öneriler üzerinde toplam yurttaş etkisi)</li>
                  <li>Toplam onaylanan öneriler içinde onaylanan yurttaş önerilerinin yüzdesi (onaylanan öneri üzerinde göreli yurttaş etkisi)</li>
                </ul>
              </li>
              <li>
                Çıktılar/sonuçlar üzerinde yurttaş etkisi
                <ul>
                  <li>Toplam sonuçlar içinde yurttaş önerilerine bağlı sonuçların yüzdesi (çıktılar üzerinde toplam yurttaş etkisi)</li>
                </ul>
              </li>
            </ul>

            <h3>Melezleşme</h3>

            <p>Bu gösterge, süreç boyunca çevrimiçi ve çevrimdışı alanlar arasındaki birleşim düzeyini ölçer.</p>

            <ul>
              <li>Bir toplantı bileşeni etkin mi? (Evet=5, Hayır=0)</li>
              <li>Yüz yüze toplantılar var mı? (Evet=5, Hayır=0)</li>
              <li>Çevrimiçi toplantılar var mı? (Evet=5, Hayır=0)</li>
              <li>Hibrit toplantılar var mı? (Evet=5, Hayır=0)</li>
              <li>Toplantılardan oluşturulan öneriler var mı? (Evet=5, Hayır=0)</li>
            </ul>

            <h3>Yanıt Verebilirlik</h3>

            <p>Bu gösterge, kuruluşun katılımcı girdisine yanıt verebilirlik düzeyini ölçer. Resmi yanıtlar ve uygulanan kararlar aracılığıyla etkileşimlerini yansıtır.</p>

            <ul>
              <li>Yanıtı olan önerilerin yüzdesi (n/toplam) – Öneri kurumsal yanıt verebilirliği</li>
              <li>%100 tamamlanan sonuçların yüzdesi (n/toplam)</li>
            </ul>

            <h3>İzlenebilirlik</h3>

            <p>Bu gösterge, katılım sürecinin şeffaflığını ve izlenebilirliğini ölçer. Katılımcıların önerilerin gelişimini ne kadar kolay takip edebildiğini ve yayımlanan kayıtlar aracılığıyla kurumsal eylemleri ne kadar doğrulayabildiğini yansıtır.</p>

            <ul>
              <li>Geçmişi olan öneri sayısı (n/toplam)</li>
              <li>Önerilere bağlı sonuçların yüzdesi (n/toplam)</li>
              <li>Tutanağı yayımlanmış olarak kapatılan toplantıların yüzdesi (n/toplam)</li>
              <li>Açık veri modülünün etkinleştirilmesi (ikili: 0 veya 5)</li>
              <li>Bütçelerle ilişkili önerilerin yüzdesi (n/toplam)</li>
            </ul>

            <br><br>
            <h3>Öz Değerlendirme Ölçütleri</h3>

            <p>Otomatik ölçütlere ek olarak, her katılım sürecinin niteliksel boyutlarını değerlendirmek için bir <strong>öz değerlendirme formu</strong> kullanılmasını öneriyoruz. Bu form, her sürecin sonunda platform yöneticileri tarafından doldurulacak ve yanıtlar göstergeler içerik bloğunda herkese açık olarak görüntülenecektir.</p>

            <p>Bu sorular, yalnızca niceliksel verilerle değerlendirilemeyen demokratik kalite yönlerini yakalamayı amaçlar. Bu ankete verilen yanıtların platform yöneticilerinin görüşüyle yanlı olduğunu unutmamak önemlidir.</p>

            <br><br>
            <h3>Öz değerlendirme soruları</h3>

            <p>Yöneticiler tarafından yanıtlanan öz değerlendirme formunu oluşturan sorular ile her yanıtla ilişkili değerler aşağıda belirtilmiştir.</p>

            <h4>Bilgilendiricilik</h4>

            <ol>
              <li>Yayımlanan bilgiler, karar alma mekanizmaları (ör. oylama, uzlaşı, doğrudan müzakereler) hakkında açıklık sağlıyor mu?
                <ul>
                  <li>Açıklık yok = 0</li>
                  <li>Düşük açıklık = 1</li>
                  <li>Yeterli açıklık = 2,5</li>
                  <li>Tam açıklık = 5</li>
                </ul>
              </li>
              <li>Katılımcıların tartışılan konu üzerindeki etki kapasitesine ilişkin bilgi sağlandı mı (hem sürecin iletişiminde ve davetlerde, hem de her tartışma oturumunun başında)?
                <ul>
                  <li>Asla = 0</li>
                  <li>Neredeyse hiç = 1</li>
                  <li>Genellikle = 2,5</li>
                  <li>Her zaman = 5</li>
                </ul>
              </li>
            </ol>

            <h4>Yurttaş etkisi</h4>

            <ol>
              <li>Süreçteki katılım derecesinin değerlendirilmesi
                <ul>
                  <li>Katılımcılar kuruluştan bilgi aldı. = 1</li>
                  <li>Katılımcılara danışıldı veya kuruluşa geri bildirim verdiler. = 2</li>
                  <li>Katılımcılar karar alma gücünü paylaşmaya dâhil edildi. = 3</li>
                  <li>Katılımcılar karar almaya belirleyici biçimde dâhil edildi. = 4</li>
                  <li>Katılımcılar karar almaya ve kaynakların yönetimine veya uygulamaya dâhil edildi. = 5</li>
                </ul>
              </li>
              <li>0-5 yurttaş karar müdahalesi olan aşamaların yüzdesi.
                <p>Süreçteki tüm aşamalar içinde (konuların seçilmesinden uygulamanın denetlenmesine kadar), halkın kaç tanesinde karar alma veya yürütme eylemi yapma yeteneği var?</p>
                <ul>
                  <li>0-20% = 1</li>
                  <li>20-40% = 2</li>
                  <li>40-60% = 3</li>
                  <li>60-80% = 4</li>
                  <li>80-100% = 5</li>
                </ul>
              </li>
            </ol>

            <h4>Kapsayıcılık</h4>

            <ol>
              <li>Süreçte, referans nüfusa göre aktörlerin ve katılımcıların çeşitlilik derecesi nasıl değerlendiriliyor?
                <ul>
                  <li>Hiç = 0</li>
                  <li>Düşük = 1</li>
                  <li>Yeterli = 2,5</li>
                  <li>İyi = 5</li>
                </ul>
              </li>
              <li>Süreç kaç dilde iletildi?
                <ul>
                  <li>Bir dil = 1</li>
                  <li>Toplulukta konuşulan dillerin yarısından azı = 2,5</li>
                  <li>Toplulukta konuşulan dillerin yarısından fazlası = 5</li>
                </ul>
              </li>
              <li>Yüz yüze toplantıların mekanları hareket kısıtlılığı olan kişiler için erişilebilir miydi?
                <ul>
                  <li>Hayır = 0</li>
                  <li>Kısmen = 2,5</li>
                  <li>Evet = 5</li>
                </ul>
              </li>
              <li>Katılım oturumları çeşitli zamanlarda (sabah, öğle, öğleden sonra, akşam ve hafta sonları) planlandı.
                <ul>
                  <li>Hayır = 0</li>
                  <li>Kısmen = 2,5</li>
                  <li>Evet = 5</li>
                </ul>
              </li>
              <li>Katılımcılara dijital destek sunuldu mu?
                <ul>
                  <li>Hayır = 0</li>
                  <li>Kısmen = 2,5</li>
                  <li>Evet = 5</li>
                </ul>
              </li>
            </ol>
