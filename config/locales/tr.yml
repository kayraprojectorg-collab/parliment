    help:
      participatory_spaces:
        participatory_processes:
          contextual: "<p>Bir <strong>katılım süreci</strong>, belirli bir konu üzerinde
            tanımlama yapmak ve karar almak amacıyla bir dizi katılım etkinliğidir
            (ör. önce bir anket doldurmak, sonra öneriler sunmak, bunları yüz yüze
            veya sanal toplantılarda tartışmak ve son olarak önceliklendirmek).</p>
            <p>Katılım süreçlerine örnekler: komite üyelerinin seçildiği bir süreç
            (önce adaylıklar sunulur, sonra tartışılır ve son olarak bir adaylık seçilir),
            katılımcı bütçeler (öneriler yapılır, ekonomik olarak değerlendirilir
            ve mevcut parayla oylanır), stratejik planlama süreci, bir yönetmelik
            veya normun iş birlikçi taslağının hazırlanması, bir kentsel alanın tasarımı
            veya bir kamu politikası planının üretimi.</p>\n"
          page: "<p>Bir <strong>katılım süreci</strong>, belirli bir konu üzerinde
            tanımlama yapmak ve karar almak amacıyla bir dizi katılım etkinliğidir
            (ör. önce bir anket doldurmak, sonra öneriler sunmak, bunları yüz yüze
            veya sanal toplantılarda tartışmak ve son olarak önceliklendirmek).</p>
            <p>Katılım süreçlerine örnekler: komite üyelerinin seçildiği bir süreç
            (önce adaylıklar sunulur, sonra tartışılır ve son olarak bir adaylık seçilir),
            katılımcı bütçeler (öneriler yapılır, ekonomik olarak değerlendirilir
            ve mevcut parayla oylanır), stratejik planlama süreci, bir yönetmelik
            veya normun iş birlikçi taslağının hazırlanması, bir kentsel alanın tasarımı
            veya bir kamu politikası planının üretimi.</p>\n"
          title: Katılım süreci nedir?
        assemblies:
          contextual: "<p>Bir <strong>meclis</strong>, kuruluşun belirli bir alanı
            veya kapsamı hakkında karar almak için düzenli olarak toplanan bir grup
            kuruluş üyesidir.</p> <p>Meclisler toplantılar düzenler; bazıları özel,
            bazıları açıktır. Açıksa, bunlara katılmak mümkündür (örneğin: kapasite
            izin veriyorsa katılmak, gündeme madde eklemek veya bu organın aldığı
            öneriler ve kararlar hakkında yorum yapmak).</p> <p>Örnekler: genel kurul
            (yılda bir kez toplanıp kuruluşun ana eylem çizgilerini ve yürütme organlarını
            oyla belirleyen), bir eşitlik danışma konseyi (kuruluşta toplumsal cinsiyet
            ilişkilerini nasıl iyileştireceğine dair öneriler yapmak için iki ayda
            bir toplanan), bir değerlendirme komisyonu (bir süreci izlemek için her
            ay toplanan) veya bir güvence organı (karar alma prosedürlerini iyileştirmek
            için olayları, suistimalleri veya önerileri toplayan) meclis örnekleridir.</p>\n"
          page: "<p>Bir <strong>meclis</strong>, kuruluşun belirli bir alanı veya
            kapsamı hakkında karar almak için düzenli olarak toplanan bir grup kuruluş
            üyesidir.</p> <p>Meclisler toplantılar düzenler; bazıları özel, bazıları
            açıktır. Açıksa, bunlara katılmak mümkündür (örneğin: kapasite izin veriyorsa
            katılmak, gündeme madde eklemek veya bu organın aldığı öneriler ve kararlar
            hakkında yorum yapmak).</p> <p>Örnekler: genel kurul (yılda bir kez toplanıp
            kuruluşun ana eylem çizgilerini ve yürütme organlarını oyla belirleyen),
            bir eşitlik danışma konseyi (kuruluşta toplumsal cinsiyet ilişkilerini
            nasıl iyileştireceğine dair öneriler yapmak için iki ayda bir toplanan),
            bir değerlendirme komisyonu (bir süreci izlemek için her ay toplanan)
            veya bir güvence organı (karar alma prosedürlerini iyileştirmek için olayları,
            suistimalleri veya önerileri toplayan) meclis örnekleridir.</p>\n"
          title: Meclis nedir?
